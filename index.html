<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2937">
<title>Garantías</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root { --bg:#f3f4f6; --card:#fff; --txt:#111827; --sub:#6b7280; --pri:#1f2937; --acc:#f59e0b; --borde:#d1d5db; --err:#dc2626; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, Roboto, sans-serif; background:var(--bg); color:var(--txt); padding-bottom:76px; }
  header { background:var(--pri); color:#fff; padding:14px 16px; font-weight:700; font-size:18px; position:sticky; top:0; z-index:5; }
  main { max-width:560px; margin:0 auto; padding:12px 16px; }
  .card { background:var(--card); border-radius:12px; padding:14px; margin-bottom:12px; box-shadow:0 1px 2px rgba(0,0,0,.06); }
  .card h2 { font-size:14px; text-transform:uppercase; letter-spacing:.04em; color:var(--sub); margin:0 0 10px; }
  label { display:block; font-size:13px; color:var(--sub); margin:8px 0 4px; }
  input, textarea, select { font-family:inherit; width:100%; font-size:17px; padding:11px 12px; border:1px solid var(--borde); border-radius:8px; background:#fff; color:var(--txt); }
  input:focus, textarea:focus { outline:2px solid var(--acc); border-color:transparent; }
  textarea { min-height:80px; resize:vertical; }
  .fila { display:flex; gap:8px; }
  .fila > div { flex:1; min-width:0; }
  .seg { display:flex; border:1px solid var(--borde); border-radius:10px; overflow:hidden; }
  .seg button { flex:1; padding:12px; font-size:16px; border:0; background:#fff; color:var(--txt); }
  .seg button.on { background:var(--pri); color:#fff; font-weight:600; }
  .btn { display:block; width:100%; padding:15px; font-size:17px; font-weight:700; border:0; border-radius:10px; background:var(--pri); color:#fff; margin-top:6px; }
  .btn.acc { background:#16a34a; }
  .btn.sec { background:#e5e7eb; color:var(--txt); }
  .btn.chico { display:inline-block; width:auto; padding:9px 12px; font-size:14px; margin:0; }
  .opc { font-weight:400; font-size:12px; }
  .invalido { border-color:var(--err); }
  .previa { font-weight:700; font-size:18px; margin-top:8px; }
  nav { position:fixed; bottom:0; left:0; right:0; display:flex; background:#fff; border-top:1px solid var(--borde); padding-bottom:env(safe-area-inset-bottom); z-index:5; }
  nav button { flex:1; padding:14px 4px; border:0; background:none; font-size:15px; color:var(--sub); }
  nav button.on { color:var(--pri); font-weight:700; box-shadow: inset 0 3px 0 var(--acc); }
  .item { border-bottom:1px solid #eee; padding:10px 0; }
  .item:last-child { border-bottom:0; }
  .item .t { font-weight:700; }
  .item .s { color:var(--sub); font-size:14px; margin:2px 0 8px; }
  .item .acciones { display:flex; gap:8px; }
  .logo-prev { max-width:140px; max-height:90px; display:block; margin:8px 0; }
  .ok { text-align:center; }
  .ok .grande { font-size:40px; }
  .vacio { color:var(--sub); text-align:center; padding:20px 0; }
  .chips { display:flex; flex-direction:column; gap:8px; }
  .chips label { display:flex; align-items:center; gap:10px; margin:0; padding:11px 12px; border:1px solid var(--borde); border-radius:8px; font-size:16px; color:var(--txt); }
  .chips input { width:22px; height:22px; flex:none; accent-color:var(--pri); }
  .chips label:has(input:checked) { background:#fff3cd; border-color:#c89600; }
  .editables { display:flex; flex-direction:column; gap:8px; }
  .editables div { display:flex; gap:8px; }
  .editables button { flex:none; width:46px; border:1px solid var(--borde); border-radius:8px; background:#fff; color:var(--err); font-size:18px; }
  .oculto { display:none !important; }
</style>
</head>
<body>
<header id="titulo">Garantías</header>
<main>

  <!-- CONFIGURACIÓN -->
  <section id="v-config" class="oculto">
    <div class="card">
      <h2>Datos de tu negocio</h2>
      <p id="bienvenida" style="margin-top:0">Completá esto una sola vez. Aparece en todas las garantías.</p>
      <label>Nombre de fantasía</label>
      <input id="c-nombre" autocomplete="organization">
      <label>Teléfono</label>
      <input id="c-telefono" type="tel" inputmode="tel">
      <label>Dirección <span class="opc">(opcional)</span></label>
      <input id="c-direccion">
      <label>Localidad</label>
      <input id="c-localidad">
      <label>Logo <span class="opc">(opcional)</span></label>
      <img id="c-logo-prev" class="logo-prev oculto" alt="Logo">
      <input id="c-logo" type="file" accept="image/*">
      <button id="c-quitar-logo" class="btn sec chico oculto" style="margin-top:8px">Quitar logo</button>
      <label>Defectos frecuentes para tildar en observaciones</label>
      <div id="c-defectos" class="editables"></div>
      <button id="c-agregar-defecto" type="button" class="btn sec chico" style="margin-top:8px">+ Agregar defecto</button>
      <button id="c-guardar" class="btn" style="margin-top:16px">Guardar</button>
    </div>
  </section>

  <!-- NUEVA GARANTÍA -->
  <section id="v-nueva" class="oculto">
    <form id="f" novalidate>
      <div class="card">
        <h2>Neumáticos</h2>
        <div class="seg" id="tipo">
          <button type="button" data-v="auto" class="on">Auto / Camioneta</button>
          <button type="button" data-v="moto">Moto</button>
        </div>
        <div class="fila">
          <div><label>Cantidad</label><input name="cantidad" type="number" inputmode="numeric" min="1" required></div>
          <div style="flex:2"><label>Marca</label><input name="marcaCubierta" list="marcas" required autocapitalize="words"></div>
        </div>
        <datalist id="marcas">
          <option>Pirelli</option><option>Fate</option><option>Bridgestone</option><option>Firestone</option>
          <option>Michelin</option><option>Goodyear</option><option>Continental</option><option>Dunlop</option>
          <option>Hankook</option><option>Kumho</option><option>Yokohama</option><option>Sailun</option>
          <option>Metzeler</option><option>Levorin</option><option>Rinaldi</option>
        </datalist>
        <div id="medida-auto" class="fila">
          <div><label>Ancho</label><input name="ancho" inputmode="numeric" placeholder="205" required></div>
          <div><label>Perfil</label><input name="perfil" inputmode="numeric" placeholder="55" required></div>
          <div><label>Rodado</label><input name="rodado" inputmode="numeric" placeholder="16" required></div>
        </div>
        <div id="medida-moto" class="fila oculto">
          <div><label>Medida</label><input name="mMedida" inputmode="decimal" placeholder="110" required></div>
          <div><label>Perfil <span class="opc">(opc.)</span></label><input name="mPerfil" inputmode="numeric" placeholder="90"></div>
          <div><label>Rodado</label><input name="mRodado" inputmode="numeric" placeholder="17" required></div>
        </div>
        <div class="previa" id="previa"></div>
      </div>

      <div class="card">
        <h2>Comprador</h2>
        <div class="fila">
          <div><label>Apellido</label><input name="apellido" required autocapitalize="words"></div>
          <div><label>Nombre</label><input name="nombre" required autocapitalize="words"></div>
        </div>
        <div class="fila">
          <div><label>DNI</label><input name="dni" inputmode="numeric" required></div>
          <div><label>Teléfono</label><input name="telefono" type="tel" inputmode="tel" required></div>
        </div>
      </div>

      <div class="card">
        <h2>Vehículo</h2>
        <div class="fila">
          <div><label>Marca</label><input name="marcaVehiculo" required autocapitalize="words"></div>
          <div><label>Modelo</label><input name="modelo" required autocapitalize="words"></div>
        </div>
        <div class="fila">
          <div><label>Año <span class="opc">(opcional)</span></label><input name="anio" inputmode="numeric" maxlength="4"></div>
          <div><label>Dominio</label><input name="dominio" required autocapitalize="characters" style="text-transform:uppercase"></div>
        </div>
      </div>

      <div class="card">
        <h2>Observaciones <span class="opc">(opcional)</span></h2>
        <div id="defectos" class="chips"></div>
        <label>Detalles / otros</label>
        <textarea name="observaciones" placeholder="Ej.: delantera derecha."></textarea>
      </div>

      <button class="btn" type="submit">Generar garantía</button>
    </form>
  </section>

  <!-- RESULTADO -->
  <section id="v-ok" class="oculto">
    <div class="card ok">
      <div class="grande">✅</div>
      <p><b>Garantía generada</b><br><span id="ok-archivo"></span></p>
      <button id="ok-compartir" class="btn acc">Compartir (WhatsApp)</button>
      <button id="ok-nueva" class="btn sec">Nueva garantía</button>
    </div>
  </section>

  <!-- HISTORIAL -->
  <section id="v-historial" class="oculto">
    <div class="card">
      <input id="buscar" type="search" placeholder="Buscar por apellido, DNI o dominio">
    </div>
    <div class="card" id="lista"></div>
  </section>
</main>

<nav id="nav" class="oculto">
  <button data-v="nueva" class="on">Nueva</button>
  <button data-v="historial">Historial</button>
  <button data-v="config">Mis datos</button>
</nav>

<script src="vendor/jspdf.umd.min.js"></script>
<script src="pdf.js"></script>
<script src="app.js"></script>
</body>
</html>
